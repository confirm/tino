[project]

name = 'tino'
description = 'A collaborative, self-hosted editing platform around Typst.'
readme = 'README.md'

authors = [
    { name = 'confirm IT' }
]

classifiers = [
    'Programming Language :: Python :: 3',
    'License :: OSI Approved :: GNU Affero General Public License v3',
    'Operating System :: OS Independent',
]

dynamic = [
    'version',
]

requires-python = '>=3.14'

dependencies = [
    'anyio==4.15.1',
    'authlib==1.9.1',
    'fastapi==0.162.0',
    'mcp>=2.3.0',
    'gitpython==3.2.1',
    'gunicorn==26.2.0',
    'httpx==0.28.1',
    'itsdangerous==2.2.0',
    'pycrdt==0.14.10',
    'pycrdt-websocket==0.16.5',
    'python-multipart==0.0.32',
    'pyyaml==6.0.3',
    'uvicorn[standard]==0.54.0',
]


[project.optional-dependencies]

develop = [
    'build',
    'furo',
    'isort',
    'pycodestyle',
    'pylint',
    'pytest',
    'pytest-cov',
    'Sphinx',
    'sphinx-autobuild',
    'sphinxcontrib-mermaid',
]


[build-system]

requires = [
    'setuptools>=84.2.1',
    'setuptools_scm[toml]',
    'wheel',
]

build-backend = 'setuptools.build_meta'


[tool.setuptools.packages.find]

include = [
    'tino',
    'tino.*',
]

exclude = [
    'tests',
    'tests.*',
]

[tool.setuptools.package-data]

'tino' = [
    'static/**/*',
    'static/*',
]

[tool.setuptools_scm]


[tool.pytest.ini_options]

testpaths = ['tests']
addopts = '--strict-markers'
markers = [
    'typst: requires the typst CLI on the PATH (skipped otherwise)',
    'pandoc: requires the pandoc CLI on the PATH (skipped otherwise)',
]


[tool.coverage.run]

source = ['tino']
branch = true
